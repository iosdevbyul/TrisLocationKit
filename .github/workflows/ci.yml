name: CI

on:
  push:

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift and Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve Dependencies
        run: |
          swift package resolve

      - name: Prepare iOS Simulator
        run: |
          set -euo pipefail

          xcrun simctl list runtimes -j > /tmp/runtimes.json
          xcrun simctl list devices -j > /tmp/devices.json
          xcrun simctl list devicetypes -j > /tmp/devicetypes.json

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          with open("/tmp/runtimes.json") as f:
              runtimes_data = json.load(f)

          with open("/tmp/devices.json") as f:
              devices_data = json.load(f)

          with open("/tmp/devicetypes.json") as f:
              device_types_data = json.load(f)

          def version_tuple(version):
              return tuple(
                  int(part)
                  for part in re.findall(r"\d+", version)
              )

          ios_runtimes = [
              runtime
              for runtime in runtimes_data["runtimes"]
              if runtime.get("isAvailable", False)
              and runtime.get("name", "").startswith("iOS ")
          ]

          if not ios_runtimes:
              raise SystemExit(
                  "No available iOS Simulator runtime found."
              )

          runtime = max(
              ios_runtimes,
              key=lambda item: version_tuple(
                  item.get("version", "0")
              )
          )

          runtime_id = runtime["identifier"]

          print(
              f"Using runtime: "
              f"{runtime['name']} ({runtime_id})"
          )

          available_devices = [
              device
              for device in devices_data
                  .get("devices", {})
                  .get(runtime_id, [])
              if device.get("isAvailable", True)
              and device.get("name", "").startswith("iPhone")
          ]

          device_id = None

          preferred_names = [
              "iPhone 17",
              "iPhone 17 Pro",
              "iPhone 17 Pro Max",
              "iPhone 17e",
              "iPhone Air",
          ]

          for preferred_name in preferred_names:
              matching_device = next(
                  (
                      device
                      for device in available_devices
                      if device["name"] == preferred_name
                  ),
                  None
              )

              if matching_device:
                  device_id = matching_device["udid"]

                  print(
                      f"Using existing simulator: "
                      f"{matching_device['name']} "
                      f"({device_id})"
                  )

                  break

          if device_id is None and available_devices:
              device = available_devices[0]
              device_id = device["udid"]

              print(
                  f"Using existing simulator: "
                  f"{device['name']} "
                  f"({device_id})"
              )

          if device_id is None:
              device_types = (
                  device_types_data.get("devicetypes", [])
              )

              device_type = None

              for preferred_name in preferred_names:
                  device_type = next(
                      (
                          item
                          for item in device_types
                          if item.get("name") == preferred_name
                      ),
                      None
                  )

                  if device_type:
                      break

              if device_type is None:
                  device_type = next(
                      (
                          item
                          for item in device_types
                          if item.get("name", "")
                              .startswith("iPhone")
                      ),
                      None
                  )

              if device_type is None:
                  raise SystemExit(
                      "No iPhone Simulator device type found."
                  )

              print(
                  f"Creating simulator using "
                  f"{device_type['name']}"
              )

              result = subprocess.run(
                  [
                      "xcrun",
                      "simctl",
                      "create",
                      "CI iPhone",
                      device_type["identifier"],
                      runtime_id,
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )

              device_id = result.stdout.strip()

              print(
                  f"Created simulator: {device_id}"
              )

          github_env = os.environ["GITHUB_ENV"]

          with open(github_env, "a") as f:
              f.write(
                  f"SIMULATOR_ID={device_id}\n"
              )
          PY

          echo "Selected simulator: $SIMULATOR_ID"

          xcrun simctl boot "$SIMULATOR_ID" || true

          xcrun simctl bootstatus \
            "$SIMULATOR_ID" \
            -b

      - name: Build and Test
        run: |
          set -euo pipefail

          xcodebuild \
            -scheme TrisLocationKit \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test